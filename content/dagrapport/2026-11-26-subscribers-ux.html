<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Books • UX concept</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f4;color:#182d28;font:17px/1.55 system-ui,sans-serif}button,input,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}a{color:#205d45}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #b86112;outline-offset:3px}.review{background:#182d28;color:white;padding:12px 24px;font-size:14px}.review span{float:right;opacity:.8}.wrap{max-width:1180px;margin:auto;padding:0 32px}.tabs{display:flex;gap:8px;padding:20px 0;flex-wrap:wrap}.tabs button{background:white;border:1px solid #dce5df;border-radius:24px;padding:9px 18px;font-size:15px}.tabs button[aria-selected=true]{background:#182d28;color:white}header{display:flex;justify-content:space-between;align-items:center;padding:24px 0;border-bottom:1px solid #dce5df}.logo{font:bold 27px Georgia,serif;letter-spacing:-1px}nav{display:flex;gap:25px;font-size:15px}.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:65px;align-items:center;padding:55px 0}.eyebrow{font-size:13px;letter-spacing:1.8px;font-weight:700;text-transform:uppercase;color:#205d45}h1{font:normal clamp(42px,5vw,64px)/1.06 Georgia,serif;letter-spacing:-2px;margin:16px 0 24px}h2{font:normal 30px/1.15 Georgia,serif;margin:8px 0 15px}h3{font:normal 24px/1.2 Georgia,serif;margin:0 0 10px}p{margin:0 0 18px}.intro{font-size:19px;color:#5e6d65}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}.tags span{font-size:14px;padding:6px 11px;border:1px solid #dce5df;border-radius:6px;background:white}.signup{background:white;border:1px solid #dce5df;border-radius:18px;padding:30px;box-shadow:0 12px 40px #153c2610}.signup p{font-size:16px;color:#5e6d65}label{display:block;font-size:15px;font-weight:600;margin-bottom:7px}input[type=email],select{width:100%;padding:13px;border:1px solid #9baea1;border-radius:7px;margin-bottom:12px;background:white}.check{display:flex;gap:9px;font-size:14px;font-weight:400;margin:5px 0 18px}.check input{min-width:18px;height:18px;accent-color:#205d45}.primary{border:0;border-radius:7px;background:#205d45;color:white;font-weight:650;padding:14px 18px;width:100%}.fine{font-size:13px!important;line-height:1.5;color:#5e6d65;margin:12px 0}.skip{display:block;text-align:center;font-size:14px;margin-top:18px}.section{padding:30px 0;border-top:1px solid #dce5df}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:white;border:1px solid #dce5df;border-radius:11px;padding:22px}.card p,.card a{font-size:15px}.card p{color:#5e6d65}.extra{display:flex;justify-content:space-between;align-items:center;gap:30px}.extra p{font-size:15px;color:#5e6d65;max-width:640px}.outline{padding:12px 18px;border:1px solid #182d28;background:white;border-radius:7px;white-space:nowrap;font-size:15px}.note{background:#e8eee9;border-radius:8px;padding:16px;font-size:14px;margin:24px 0}.reader{max-width:710px;margin:45px auto}.reader .signup{max-width:540px}.footer{padding:25px 0;color:#5e6d65;font-size:13px;display:flex;justify-content:space-between;gap:20px}.textbutton{border:0;padding:0;background:none;text-decoration:underline;color:#205d45;font-size:14px}.success{text-align:center;padding:15px 0}.stamp{font-size:32px;margin-bottom:12px}.status{background:#e8eee9;padding:12px;border-radius:6px;font-size:14px}dialog{border:1px solid #9baea1;border-radius:14px;padding:28px;max-width:420px}dialog::backdrop{background:#182d2866}@media(max-width:700px){.wrap{padding:0 20px}.review{padding:10px 20px}.review span{display:none}.tabs{gap:6px;padding:14px 0}.tabs button{padding:8px 12px;font-size:14px}header{padding:16px 0}.logo{font-size:23px}nav{gap:14px;font-size:13px}.hero{grid-template-columns:1fr;gap:25px;padding:32px 0}h1{letter-spacing:-1.4px}.intro{font-size:17px}.signup{padding:23px}.cards{grid-template-columns:1fr}.extra{flex-direction:column;align-items:flex-start;gap:5px}.footer{flex-direction:column;gap:8px}.reader{margin:30px 0}}
</style><body><div class="review"><strong>UX CONCEPT · Niet live</strong><span>Demo: niets wordt opgeslagen of verzonden</span></div><div class="wrap"><div class="tabs" role="tablist"><button role="tab" data-view="sb" aria-selected="true">Stocking Books</button><button role="tab" data-view="lc" aria-selected="false">Lasting Change</button><button role="tab" data-view="readers" aria-selected="false">Lezersteam</button></div><header><div class="logo" id="brand">Stocking Books.</div><nav><a id="navfree" href="https://stockingbooks.com/">Free activities</a><a id="navbooks" href="https://stockingbooks.com/all-books">Our books</a></nav></header><main id="content"></main><div class="footer"><span>Concept 26 november 2026 · Mobiel en desktop</span><button class="textbutton" id="preferences">Demo: voorkeuren en uitschrijven</button></div></div><dialog id="prefs"><form method="dialog"><h2>Your email preferences</h2><label for="frequency">How often?</label><select id="frequency"><option>Once a week</option><option>Once a month</option><option>Pause for 30 days</option></select><button class="primary">Save demo preferences</button><button type="button" class="textbutton" id="unsubscribe" style="margin-top:18px">Unsubscribe from this brand</button><p class="fine" id="prefstatus">Demo only. No subscription is changed.</p></form></dialog><script>
const D={sb:{brand:'Stocking Books.',eye:'Free Christmas activities',title:'A little less planning.<br>A little more together.',intro:'Print a puzzle. Try a family quiz. Find something everyone can enjoy, without another account or app.',offer:'Make the next family night easy.',promise:'Get links to our free Christmas activities, then one weekly email with free activities and book ideas.',button:'Email me the free activities',consent:'Yes, send me the activity links and weekly Stocking Books emails.',skip:'Just print today’s word searches',url:'https://stockingbooks.com/free-printable-christmas-word-search',tags:['12 word searches','Family quiz','Free printable activities'],cards:[['Christmas word searches','Twelve free puzzles to print and enjoy.','Print the word searches','https://stockingbooks.com/free-printable-christmas-word-search'],['Family activities','Find more existing free activities on Stocking Books.','Explore the activities','https://stockingbooks.com/'],['Little gifts, plenty of character','Explore our own book collection.','Browse our books','https://stockingbooks.com/all-books']],extra:'Useful for puzzle time',item:'A comfortable pencil and a good eraser',why:'A simple option for printable puzzles. Use what you already have before buying anything new.'},lc:{brand:'Lasting Change.',eye:'One practical next step',title:'You don’t need<br>a new life by Monday.',intro:'Start by choosing what to keep, what to change, and one small action you can make room for this week.',offer:'A quieter way to start over.',promise:'Get the free 7-day reset plan, then one practical reflection prompt each week. A structure to try, at your own pace.',button:'Send me the free reset plan',consent:'Yes, send me the plan link and weekly Lasting Change emails.',skip:'Read the free plan now',url:'https://lastingchange.works/how-to-start-over-in-life',tags:['A free 7-day structure','Concrete questions','At your own pace'],cards:[['Start over, one day at a time','A seven-day structure with questions you can use.','Read the free plan','https://lastingchange.works/how-to-start-over-in-life'],['When another year feels wasted','A fair review and one next step.','Read the article','https://lastingchange.works/i-wasted-another-year'],['When you keep putting it off','Make your starting point smaller.','Read about procrastination','https://lastingchange.works/how-to-stop-procrastinating']],extra:'A place for your answers',item:'A plain notebook',why:'Write your answers somewhere you can revisit. Any notebook or a notes app will do.'}};let current='sb';const main=document.getElementById('content');function signup(d,r=false){return `<div class="signup"><p class="fine">Preview: probeer de volledige aanmeldroute</p><div id="flow"><span class="eyebrow">${r?'Reader team':'Free to join'}</span><h2>${d.offer}</h2><p>${d.promise}</p><form id="signup"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" autocomplete="off" required><label class="check"><input type="checkbox" required><span>${d.consent}</span></label><button class="primary">${d.button}</button><p class="fine">Confirm by email. Unsubscribe anytime. Your address stays with ${r?'the reader team':d.brand.slice(0,-1)}.</p></form>${r?'':`<a class="skip" target="_blank" rel="noopener" href="${d.url}">${d.skip}</a>`}</div></div>`}function render(v){current=v;document.querySelectorAll('[role=tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===v));const d=D[v];document.getElementById('brand').textContent=d?d.brand:'Our reader team.';document.getElementById('navfree').textContent=v==='lc'?'Free articles':'Free activities';document.getElementById('navfree').href=d?d.url:'https://stockingbooks.com/';document.getElementById('navbooks').href=v==='lc'?'https://lastingchange.works/':'https://stockingbooks.com/all-books';if(v==='readers'){main.innerHTML=`<section class="reader"><span class="eyebrow">Voorstel vanaf 1 februari 2027</span><h1>For curious readers.<br>With your own opinion.</h1>${signup({offer:'Read something new.<br>Tell us what you think.',promise:'Occasional invitations to read a complimentary book copy. Reviews are optional, honest, and may be critical. Joining does not guarantee a copy.',consent:'Yes, email me occasional reader-copy invitations. This does not subscribe me to either weekly newsletter.',button:'Tell me when reader copies open'},true)}<div class="note">Conceptprogramma. Geen verplichte review, vergoeding, puntenruil of beloofde sterren. Titels en distributierechten worden vooraf gecontroleerd.</div></section>`}else{main.innerHTML=`<section class="hero"><div><span class="eyebrow">${d.eye}</span><h1>${d.title}</h1><p class="intro">${d.intro}</p><div class="tags">${d.tags.map(t=>`<span>${t}</span>`).join('')}</div></div>${signup(d)}</section><section class="section"><h2>Something useful, right now.</h2><p class="fine">Bestaande inhoud blijft vrij toegankelijk</p><div class="cards">${d.cards.map(c=>`<article class="card"><h3>${c[0]}</h3><p>${c[1]}</p><a target="_blank" rel="noopener" href="${c[3]}">${c[2]}</a></article>`).join('')}</div></section><section class="section"><span class="eyebrow">Optional extras</span><div class="extra"><div><h2>${d.extra}</h2><h3>${d.item}</h3><p>${d.why}</p></div><button class="outline" id="amazon">View options on Amazon</button></div><p class="fine">As an Amazon Associate I earn from qualifying purchases.</p><p class="fine">Conceptblok. Product en Associates-tag nog niet geverifieerd. De demoknop opent geen Amazonlink.</p><div id="amazonstatus" role="status"></div></section>`}document.getElementById('signup').onsubmit=e=>{e.preventDefault();document.getElementById('flow').innerHTML=`<div class="success" role="status"><div class="stamp">✉</div><h2>Check your inbox.</h2><p>One more step: confirm your email to receive ${current==='readers'?'reader-team invitations':'your free links and weekly emails'}.</p><p class="fine">Demo only. No address saved. No email sent.</p><button class="primary" id="confirm">Demo: confirm my email</button><button class="textbutton" style="margin-top:18px" onclick="render(current)">Use a different address</button></div>`;document.getElementById('confirm').onclick=()=>{document.getElementById('flow').innerHTML=`<div class="success" role="status"><div class="stamp">✓</div><h2>You’re confirmed.</h2><p>${current==='readers'?'You would receive an invitation when eligible reader copies become available.':'Your free resource is ready. Your first weekly email would follow after launch.'}</p>${current==='readers'?'':`<a target="_blank" rel="noopener" href="${D[current].url}">Open your free ${current==='sb'?'activities':'reset plan'}</a>`}<p class="fine">Simulated confirmation. No subscriber created.</p><button class="textbutton" onclick="render(current)">Restart demo</button></div>`}};const a=document.getElementById('amazon');if(a)a.onclick=()=>document.getElementById('amazonstatus').innerHTML='<p class="status">Demo: hier komt een gecontroleerde Associates-link naar een passend product. Niets geopend of gemeten.</p>'}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>render(b.dataset.view));document.getElementById('preferences').onclick=()=>document.getElementById('prefs').showModal();document.getElementById('unsubscribe').onclick=()=>document.getElementById('prefstatus').textContent='Demo: unsubscribed from this brand. No real subscription changed.';render('sb');
</script></body></html>
